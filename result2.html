<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background: url("https://media.gettyimages.com/id/1359396635/vector/cancer-cells-illustration.jpg?s=612x612&w=0&k=20&c=sVNCHkjogYCV9NGf-P-0GbLgP0h35OOqi_cRwkbmVXE=") no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            background-color: rgba(226, 23, 202, 0.134);  /* Fully transparent background */
            padding: 30px;
            width: 50%;
            margin: auto;
        }
        h1 {
            color: #fff;  /* White text */
        }
        .result {
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0);  /* Transparent result box */
            padding: 20px;
            border-radius: 10px;
        }
        .prediction {
            font-size: 32px;
            font-weight: bold;
            color: black;
        }
        .confidence {
            font-size: 29px;
            font-weight: bold;
            color: rgb(104, 68, 220);
        }
        .image-container {
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0);  /* Transparent image container */
        }
        img {
            width: 50%;
            max-width: 500px;
            border: 3px solid #333;
            border-radius: 10px;
        }
        button {
            background-color: black;  /* Semi-transparent button */
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background-color: green;
        }
        /* Input box transparency */
        input[type="file"] {
            background-color: rgba(255, 255, 255, 0);  /* Transparent background */
            border: 2px solid rgba(255, 255, 255, 0.6);  /* Transparent border */
            color: white;  /* White text color */
            padding: 10px;
            font-size: 16px;
            width: 100%;
            border-radius: 5px;
            margin-top: 20px;
            box-sizing: border-box;
        }
        input[type="file"]::-webkit-file-upload-button {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="file"]:hover::-webkit-file-upload-button {
            background-color: rgba(70, 130, 180, 0.7);  /* Semi-transparent button effect on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 38px; font-weight: bold; color: black;">Prediction Result</h1>
        <div class="result">
            <div class="prediction">
                Predicted Class: {{ prediction }}
            </div>
            <div class="confidence">
                Confidence: {{ confidence * 100 }}%
            </div>
        </div>

        <div class="image-container">
            <h3>Uploaded Image:</h3>
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Uploaded Image">
        </div>

        <a href="/">
            <button>Upload Another Image</button>
        </a>
    </div>
</body>
</html>
