<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background: url("https://media.gettyimages.com/id/1623197589/photo/cancer-cells-vis.jpg?s=612x612&w=0&k=20&c=EUylLifjg1Z8Dl2LQF6diTgwjKPZkm8DpWOnZsmXXeI=") no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            background-color: rgba(255, 255, 255, 0);  /* Transparent white background */
            border-radius: 10px;
            padding: 30px;
            width: 50%;
            margin: auto;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: green;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 38px; font-weight: bold; color: black;">Upload Image for Prediction</h1>
        <form method="POST" enctype="multipart/form-data" action="/">
            <input type="file" name="file" required>
            <br>
            <button type="submit">Upload Image</button>
        </form>
    </div>
</body>
</html>
